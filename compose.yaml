services:
  postgres:
    image: postgres:16.6-alpine
    container_name: gridwords-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gridwords}
      POSTGRES_USER: ${POSTGRES_USER:-gridwords}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gridwords-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - gridwords-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gridwords} -d ${POSTGRES_DB:-gridwords}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gridwords-postgres-data:
