name: CI

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
  pull_request:

permissions:
  contents: write

jobs:
  package5-completion:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/quadwords-image-parser'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/quadwords-image-parser
          fetch-depth: 0

      - name: Execute reviewed one-time patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/package5-selfpatch.yml')
          text = workflow.read_text(encoding='utf-8')
          payload = text.split("python <<'PY'\n", 1)[1].rsplit("\n          PY", 1)[0]
          exec(compile(dedent(payload), str(workflow), 'exec'), {})
          PY

      - name: Restore CI workflow and push patch
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete QuadWords parser recovery and compatibility"
          git push origin HEAD:feature/quadwords-image-parser

  standard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

  database-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify PostgreSQL persistence integration
        run: mvn --batch-mode --no-transfer-progress -Pdatabase-integration clean verify
