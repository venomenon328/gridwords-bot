name: CI

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
  pull_request:

permissions:
  contents: write

jobs:
  restore-persistence-base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/quadwords-image-parser'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/quadwords-image-parser
          fetch-depth: 0

      - name: Restore reviewed persistence implementation as non-component base
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import subprocess

          blob = "bff4db982f8fc9e8b4f96bffbfee4d41157cf162"
          text = subprocess.check_output(["git", "show", blob], text=True)
          text = text.replace("import org.springframework.context.annotation.Profile;\n", "")
          text = text.replace("import org.springframework.stereotype.Repository;\n", "")
          text = text.replace("/** PostgreSQL-specific, conflict-safe implementation of the persistence ports. */\n@Repository\n@Profile(\"database\")\n", """/**
 * PostgreSQL-specific, conflict-safe implementation of the persistence ports.
 *
 * <p>The concrete database-profile component is {@link LegacyCompatiblePostgresPersistenceAdapter}; this base
 * remains directly constructible for focused integration tests.</p>
 */
""")
          Path("src/main/java/de/venomenon/gridwordsbot/adapter/persistence/PostgresPersistenceAdapter.java").write_text(
              text, encoding="utf-8")
          PY

      - name: Restore standard CI and push
        shell: bash
        run: |
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: use legacy-compatible persistence bean"
          git push origin HEAD:feature/quadwords-image-parser

  standard-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

  database-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify PostgreSQL persistence integration
        run: mvn --batch-mode --no-transfer-progress -Pdatabase-integration clean verify
