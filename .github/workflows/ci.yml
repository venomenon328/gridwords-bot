name: CI

on:
  push:
    branches:
      - main
      - "setup/**"
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  standard-build:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

  database-integration:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify PostgreSQL persistence integration
        run: mvn --batch-mode --no-transfer-progress -Pdatabase-integration clean verify