                      }, imageParser(new QuadWordsImageParser.Parse.Parsed(boards(9))));
                      InboundSharedMessage inbound = message(28L, TOBIAS, quadWords(), List.of(image(28L, 700L)));

                      assertThat(service.process(inbound)).isEqualTo(new ProcessingResult.Ignored());
                      assertThat(store.submissions.get(28L).state())
                              .isEqualTo(SubmissionStore.SubmissionState.FAILED_RETRYABLE);
                      assertThat(store.submissions.get(28L).gameResultId()).isEmpty();

                      assertThat(service.process(inbound))
                              .isEqualTo(new ProcessingResult.Accepted(
                                      de.venomenon.gridwordsbot.domain.model.GameType.QUADWORDS));
                      assertThat(loads).hasValue(2);
                      assertThat(store.results).hasSize(1);
                      assertThat(store.submissions.get(28L).state())
                              .isEqualTo(SubmissionStore.SubmissionState.RESULT_STORED);
                  }

                  @Test
