name: Apply package 5 completion patch

on:
  push:
    branches:
      - feature/quadwords-image-parser
    paths:
      - .github/workflows/package5-selfpatch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/quadwords-image-parser
          fetch-depth: 0

      - name: Apply reviewed package 5 changes
