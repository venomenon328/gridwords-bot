name: Container image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: Explicit release tag in MAJOR.MINOR.PATCH format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: container-image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify project
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Verify PostgreSQL persistence integration
        run: mvn --batch-mode --no-transfer-progress -Pdatabase-integration clean verify

  verify-image:
    name: Build and inspect image
    needs: test
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.metadata.outputs.revision }}
      build_date: ${{ steps.metadata.outputs.build_date }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read deterministic image metadata
        id: metadata
        shell: bash
        run: |
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_date=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gridwords-bot:ci
          build-args: |
            VCS_REF=${{ steps.metadata.outputs.revision }}
            VERSION=sha-${{ steps.metadata.outputs.revision }}
            BUILD_DATE=${{ steps.metadata.outputs.build_date }}

      - name: Verify runtime image contents
        shell: bash
        run: |
          test "$(docker image inspect gridwords-bot:ci --format '{{.Config.User}}')" = "gridwords:gridwords"
          docker run --rm --entrypoint /bin/sh gridwords-bot:ci -c '
            test "$(id -u)" = "10001" &&
            test -f /app/gridwords-bot.jar &&
            test ! -e /app/.env &&
            test ! -e /workspace &&
            test ! -d /root/.m2
          '

  publish-image:
    name: Publish private GHCR image
    needs: [test, verify-image]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate manual release tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          [[ "${{ inputs.release_tag }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image-metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/venomenon328/gridwords-bot
          tags: |
            type=sha,prefix=sha-,format=long
            type=raw,value=${{ inputs.release_tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-metadata.outputs.tags }}
          labels: ${{ steps.image-metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          build-args: |
            VCS_REF=${{ needs.verify-image.outputs.revision }}
            VERSION=sha-${{ needs.verify-image.outputs.revision }}
            BUILD_DATE=${{ needs.verify-image.outputs.build_date }}
