spring:
  application:
    name: gridwords-bot
  config:
    import: optional:file:.env[.properties]
  main:
    web-application-type: none
  profiles:
    default: offline

management:
  endpoints:
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
    metrics:
      enabled: true

logging:
  level:
    de.venomenon.gridwordsbot: INFO


gridwords:
  discord:
    enabled: ${DISCORD_ENABLED:false}
    token: ${DISCORD_BOT_TOKEN:}
    guild-id: ${DISCORD_GUILD_ID:255064124902473729}
    channel-id: ${DISCORD_CHANNEL_ID:1531398793713549494}
    admin-user-ids: ${ADMIN_USER_IDS:255063936410451978,451773931351834634}
  schedule:
    first-reminder: ${REMINDER_FIRST_TIME:16:00}
    second-reminder: ${REMINDER_SECOND_TIME:22:00}
    daily-cleanup: ${DAILY_CLEANUP_TIME:06:00}
    weekly-report: ${WEEKLY_REPORT_TIME:08:00}
    monthly-report: ${MONTHLY_REPORT_TIME:08:15}
    time-zone: ${TIME_ZONE:Europe/Berlin}
  storage:
    raw-image-retention-hours: ${RAW_IMAGE_RETENTION_HOURS:48}
  excuse-generator:
    contextual-enabled: ${EXCUSE_GENERATOR_CONTEXTUAL_ENABLED:false}
  excuses:
    offer-lifetime: ${EXCUSE_OFFER_LIFETIME:PT15M}
    expiration-page-size: ${EXCUSE_EXPIRATION_PAGE_SIZE:25}
    expiration-max-pages: ${EXCUSE_EXPIRATION_MAX_PAGES:4}
  records:
    bootstrap-poll-delay: ${RECORD_BOOTSTRAP_POLL_DELAY:PT1M}
    bootstrap-lease-duration: ${RECORD_BOOTSTRAP_LEASE_DURATION:PT2M}
    bootstrap-retry-backoff: ${RECORD_BOOTSTRAP_RETRY_BACKOFF:PT1M}
    live-evaluation-enabled: ${RECORD_LIVE_EVALUATION_ENABLED:true}
    live-evaluation-poll-delay: ${RECORD_LIVE_EVALUATION_POLL_DELAY:PT10S}
    live-evaluation-lease-duration: ${RECORD_LIVE_EVALUATION_LEASE_DURATION:PT2M}
    live-evaluation-heartbeat-interval: ${RECORD_LIVE_EVALUATION_HEARTBEAT_INTERVAL:PT30S}
    live-evaluation-initial-retry-backoff: ${RECORD_LIVE_EVALUATION_INITIAL_RETRY_BACKOFF:PT10S}
    live-evaluation-max-retry-backoff: ${RECORD_LIVE_EVALUATION_MAX_RETRY_BACKOFF:PT5M}
    public-announcements-enabled: ${RECORD_PUBLIC_ANNOUNCEMENTS_ENABLED:false}
    announcement-poll-delay: ${RECORD_ANNOUNCEMENT_POLL_DELAY:PT10S}
    announcement-lease-duration: ${RECORD_ANNOUNCEMENT_LEASE_DURATION:PT2M}
    announcement-heartbeat-interval: ${RECORD_ANNOUNCEMENT_HEARTBEAT_INTERVAL:PT30S}
    announcement-initial-retry-backoff: ${RECORD_ANNOUNCEMENT_INITIAL_RETRY_BACKOFF:PT10S}
    announcement-max-retry-backoff: ${RECORD_ANNOUNCEMENT_MAX_RETRY_BACKOFF:PT5M}
